name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
        env:
          # Optional: add these as repository secrets to get an APK that can log in / fetch lyrics.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPICY_LYRICS_API_KEY: ${{ secrets.SPICY_LYRICS_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: spotv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
