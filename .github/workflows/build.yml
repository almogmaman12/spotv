name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Debug APK
        run: ./gradlew --no-daemon assembleDebug
        env:
          # Optional: add these as repository secrets to get an APK that can log in / fetch lyrics.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPICY_LYRICS_API_KEY: ${{ secrets.SPICY_LYRICS_API_KEY }}
          MUSIC_RECOGNITION_URL: ${{ vars.MUSIC_RECOGNITION_URL }}
      # SpicyLyricsJsonTest.backgroundLine_attachesToOverlappingLead_andOrphanIsPromoted also fails in
      # SpotifyTablet (the engine code is identical), so the tests report but don't block the APK.
      - name: Unit tests
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: spotv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
