import java.util.Properties

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
}

// Secrets come from local.properties (never committed) or, in CI, from environment variables.
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def prop = { String key, String fallback = '' ->
    (localProps[key] ?: System.getenv(key) ?: fallback).toString()
}

android {
    namespace 'com.almog.spotv'
    compileSdk 35

    defaultConfig {
        applicationId "com.almog.spotv"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        buildConfigField "String", "SPOTIFY_CLIENT_ID", "\"${prop('SPOTIFY_CLIENT_ID')}\""
        // The https page that hands the login code back to the TV (docs/callback.html on GitHub Pages).
        buildConfigField "String", "SPOTIFY_REDIRECT_URI",
                "\"${prop('SPOTIFY_REDIRECT_URI', 'https://almogmaman12.github.io/spotv/callback.html')}\""
        buildConfigField "String", "SPICY_LYRICS_API_KEY", "\"${prop('SPICY_LYRICS_API_KEY')}\""
        // Optional self-hosted or free-tier ShazamIO bridge URL. Empty until configured.
        buildConfigField "String", "MUSIC_RECOGNITION_URL", "\"${prop('MUSIC_RECOGNITION_URL')}\""
    }

    packaging {
        resources {
            // Both Kuromoji jars carry the same license/notes files.
            pickFirsts += ['META-INF/CONTRIBUTORS.md', 'META-INF/LICENSE.md', 'META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/NOTICE.md', 'META-INF/DEPENDENCIES']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Kotlin & Coroutines
    implementation libs.androidx.core.ktx
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Jetpack Compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation 'androidx.compose.foundation:foundation'
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    debugImplementation libs.androidx.ui.tooling

    // Cover colours, QR code for the phone login
    implementation libs.androidx.palette
    implementation 'com.google.zxing:core:3.5.3'

    // Networking
    implementation libs.okhttp

    // Spicy Lyrics Mobile port (lyrics sources, translation, romanization)
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'javax.inject:javax.inject:1'
    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'com.atilika.kuromoji:kuromoji-ipadic:0.9.0'

    // Testing
    testImplementation libs.junit
    testImplementation 'org.json:json:20240303'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
}
